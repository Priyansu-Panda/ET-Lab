<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="top d-flex justify-content-between p-2 align-items-center">
      <h1>HELLO</h1>
      <div class="search">
        <input
          type="text"
          class="form-control"
          style="width: 300px; height: 40px"
          placeholder="Search"
        />
      </div>
    </div>
    <div class="container row g-3">
      <div class="input-group">
        <span class="input-group-text">First name</span>
        <input type="text" aria-label="First name" class="form-control name" />
        <!-- <input type="text" aria-label="Last name" class="form-control"> -->
      </div>
      <div class="input-group">
        <span class="input-group-text">Age</span>
        <input type="text" aria-label="Age" class="form-control age" />
      </div>
      <div class="input-group">
        <span class="input-group-text">Branch</span>
        <input type="text" aria-label="Branch" class="form-control branch" />
      </div>
      <form action="">
        <button class="btn btn-primary" onclick="addStud(event)">Add</button>
      </form>
    </div>
    <table class="table table-hover">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
        <th>Branch</th>
      </tr>
      <tbody id="table-body"></tbody>
    </table>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
